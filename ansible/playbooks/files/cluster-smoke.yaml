apiVersion: v1
kind: Namespace
metadata:
  name: dacn2-cluster-smoke
  labels:
    app.kubernetes.io/part-of: dacn2-cluster-smoke
---
apiVersion: v1
kind: Pod
metadata:
  name: smoke-server
  namespace: dacn2-cluster-smoke
  labels:
    app: smoke-server
spec:
  nodeName: k8s-controller
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: server
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      command: [/agnhost, netexec, --http-port=8080]
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: smoke-client
  namespace: dacn2-cluster-smoke
spec:
  nodeName: k8s-worker
  containers:
    - name: client
      image: busybox:1.36.1
      command: [sleep, '3600']
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-server
  namespace: dacn2-cluster-smoke
spec:
  selector:
    app: smoke-server
  ports:
    - port: 8080
      targetPort: 8080
