---
- name: Check routes before preparing Kubernetes nodes
  import_playbook: preflight.yml

- name: Prepare Ubuntu nodes for kubeadm
  hosts: kubernetes
  become: true
  gather_facts: true
  serial: 1

  pre_tasks:
    - name: Require the expected Ubuntu nodes
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
          - desired_hostname is defined
          - "'controllers' in group_names or 'workers' in group_names"
        fail_msg: Stop before changing an unexpected VM.

    - name: Check free space on the root filesystem
      ansible.builtin.command:
        argv: [df, -B1, --output=avail, /]
      register: root_disk
      changed_when: false

    - name: Require at least 5 GiB free for node preparation
      ansible.builtin.assert:
        that:
          - root_disk.stdout_lines[-1] | int >= 5368709120
        fail_msg: Root filesystem has less than 5 GiB free.

    - name: List running Docker containers on the worker
      ansible.builtin.command:
        argv: [docker, ps, -q]
      register: worker_docker_containers
      changed_when: false
      when: "'workers' in group_names"

    - name: Stop if Docker still runs containers on the worker
      ansible.builtin.assert:
        that:
          - worker_docker_containers.stdout | trim == ''
        fail_msg: Stop before restarting containerd while Docker containers run.
      when: "'workers' in group_names"

    - name: Read existing worker containerd configuration
      ansible.builtin.slurp:
        src: /etc/containerd/config.toml
      register: worker_containerd_config
      when: "'workers' in group_names"

    - name: Extract active worker containerd settings
      ansible.builtin.set_fact:
        worker_containerd_active_lines: >-
          {{ (worker_containerd_config.content | b64decode).splitlines()
             | map('trim') | reject('equalto', '')
             | reject('match', '^#') | list }}
      when: "'workers' in group_names"

    - name: Refuse to replace an unfamiliar worker containerd configuration
      ansible.builtin.assert:
        that:
          - >-
            worker_containerd_active_lines == ['disabled_plugins = ["cri"]'] or
            worker_containerd_active_lines == [
              'version = 3',
              'disabled_plugins = []',
              "[plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]",
              'SystemdCgroup = true'
            ]
        fail_msg: Review the worker containerd config before replacing it.
      when: "'workers' in group_names"

  tasks:
    - name: Ensure APT prerequisites are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-apt
        state: present

    - name: Ensure the APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download the Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: '0644'
      register: kubernetes_key

    - name: Configure the Kubernetes minor-version APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: >
          deb [signed-by=/etc/apt/keyrings/kubernetes.asc]
          https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/ /
        mode: '0644'
        backup: true
      register: kubernetes_repo

    - name: Refresh APT after changing the Kubernetes repository
      ansible.builtin.apt:
        update_cache: true
      when: kubernetes_key.changed or kubernetes_repo.changed

    - name: Install Kubernetes node packages
      ansible.builtin.apt:
        name: "{{ kubernetes_node_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Install kubectl on the controller
      ansible.builtin.apt:
        name: kubectl
        state: present
      when: "'controllers' in group_names"

    - name: Hold Kubernetes component package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ kubernetes_node_packages + (['kubectl'] if 'controllers' in group_names else []) }}"

    - name: Install the Ubuntu containerd package on the controller
      ansible.builtin.apt:
        name: containerd
        state: present
      when: "'controllers' in group_names"

    - name: Ensure the containerd configuration directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Configure containerd CRI and systemd cgroups
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/containerd.toml.j2"
        dest: /etc/containerd/config.toml
        mode: '0644'
        backup: true
        validate: /usr/bin/containerd --config %s config dump
      notify: Restart containerd

    - name: Apply a pending containerd restart before checking CRI
      ansible.builtin.meta: flush_handlers

    - name: Ensure containerd is enabled and running
      ansible.builtin.service:
        name: containerd
        enabled: true
        state: started

    - name: Keep IPv4 forwarding enabled after reboot
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: "net.ipv4.ip_forward = 1\n"
        mode: '0644'
        backup: true

    - name: Read current IPv4 forwarding state
      ansible.builtin.slurp:
        src: /proc/sys/net/ipv4/ip_forward
      register: ipv4_forwarding

    - name: Enable IPv4 forwarding now
      ansible.builtin.command:
        argv: [sysctl, -w, net.ipv4.ip_forward=1]
      changed_when: true
      when: ipv4_forwarding.content | b64decode | trim != '1'

    - name: Prevent swap from activating after reboot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!\s*#)(\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'
        backup: true

    - name: Read active swap devices
      ansible.builtin.command:
        argv: [swapon, --noheadings, --show=NAME]
      register: active_swap
      changed_when: false

    - name: Disable active swap
      ansible.builtin.command:
        argv: [swapoff, -a]
      changed_when: true
      when: active_swap.stdout | trim != ''

    - name: Set the node hostname before kubeadm
      ansible.builtin.hostname:
        name: "{{ desired_hostname }}"

    - name: Keep the local hostname mapping in sync
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+'
        line: "127.0.1.1 {{ desired_hostname }}"
        state: present
        backup: true

    - name: Verify containerd exposes the CRI endpoint
      ansible.builtin.command:
        argv:
          - crictl
          - --runtime-endpoint
          - unix:///run/containerd/containerd.sock
          - version
      changed_when: false

    - name: Verify kubeadm was installed
      ansible.builtin.command:
        argv: [kubeadm, version, -o, short]
      changed_when: false

    - name: Verify swap is disabled
      ansible.builtin.command:
        argv: [swapon, --noheadings, --show=NAME]
      register: final_swap
      changed_when: false

    - name: Require swap to remain off
      ansible.builtin.assert:
        that:
          - final_swap.stdout | trim == ''

    - name: Verify Docker stayed active on the worker
      ansible.builtin.command:
        argv: [systemctl, is-active, docker]
      changed_when: false
      when: "'workers' in group_names"

  handlers:
    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
