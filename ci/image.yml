build-scan-sbom-publish:
  stage: image
  tags:
    - network-lab
  variables:
    PYTHON_BASE_IMAGE: "docker.io/library/python:3.12.16-alpine3.24@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89"
    TRIVY_IMAGE: "ghcr.io/aquasecurity/trivy:0.76.2"
    SYFT_IMAGE: "ghcr.io/anchore/syft:v1.57.2"
  rules:
    - if: '$CI_SERVER_PROTOCOL == "https" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        PUBLISH_IMAGE: "true"
    - if: '$CI_SERVER_PROTOCOL == "https" && $CI_COMMIT_BRANCH'
      variables:
        PUBLISH_IMAGE: "false"
    - when: never
  script:
    - bash ci/build-image.sh
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 7 days
