test-docker:
  stage: test
  image: alpine:latest
  tags:
    - docker
  when: manual
  allow_failure: true
  script:
    - hostname
    - echo "Docker executor OK"

test-shell:
  stage: test
  tags:
    - shell
  when: manual
  allow_failure: true
  script:
    - hostname
    - echo "Shell executor OK"
