secret-scan:
  stage: scan
  image:
    name: ghcr.io/aquasecurity/trivy:0.76.2
    entrypoint: [""]
  tags:
    - homelab
  rules:
    - if: '$CI_SERVER_PROTOCOL == "https"'
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true
  variables:
    TRIVY_NO_PROGRESS: "true"
  script:
    - |
      set -eu
      mkdir -p reports
      raw_report="$(mktemp)"
      trap 'rm -f "$raw_report"' EXIT
      set +e
      trivy fs --scanners secret --secret-config ci/trivy-secret.yaml \
        --format json --output "$raw_report" --exit-code 1 .
      scan_status=$?
      set -e
      findings=0
      if [ -s "$raw_report" ]; then
        findings="$(grep -c '"RuleID":' "$raw_report" || true)"
      fi
      outcome=pass
      if [ "$scan_status" -ne 0 ]; then
        outcome=scanner_error
        if [ "$findings" -gt 0 ]; then outcome=findings; fi
      fi
      printf '{"scanner":"trivy","version":"0.76.2","commit":"%s","outcome":"%s","finding_count":%s}\n' \
        "$CI_COMMIT_SHA" "$outcome" "$findings" > reports/secret-summary.json
      printf 'secret findings: %s\n' "$findings"
      exit "$scan_status"
  artifacts:
    when: always
    paths:
      - reports/secret-summary.json
    expire_in: 7 days
